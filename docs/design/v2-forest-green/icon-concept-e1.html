<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Oracle — Concept E1</title>
<style>
  :root {
    --paperWarm: #EFE8D6;
    --card: #FFFFFF;
    --forest500: #3F6E54;
    --forest900: #14271D;
    --ink500: #5A6A5F;
    --hairline: #D9D1BE;
    --ink900: #16221A;
  }
  html, body { margin: 0; padding: 0; background: var(--paperWarm); font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; color: var(--ink900); }
  .page { padding: 56px 48px 80px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 6px; color: var(--forest900); }
  .sub { font-size: 13px; color: var(--ink500); margin-bottom: 40px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; }
  .cell { text-align: center; }
  .tile-wrap { width: 100%; aspect-ratio: 1 / 1; border-radius: 22.37%; overflow: hidden; box-shadow: 0 12px 28px -10px rgba(20,39,29,0.35), 0 2px 4px rgba(0,0,0,0.08); }
  .tile { width: 100%; height: 100%; display: block; }
  .label-row { margin-top: 14px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--forest500); }
  .name { margin-top: 4px; font-size: 15px; font-weight: 600; color: var(--forest900); }
  .small-row { margin-top: 56px; display: flex; gap: 18px; align-items: flex-end; justify-content: center; padding: 24px; background: var(--card); border: 1px solid var(--hairline); border-radius: 16px; }
  .small-group { text-align: center; }
  .small-group .tile-wrap { width: 80px; border-radius: 22.37%; box-shadow: 0 4px 10px -4px rgba(20,39,29,0.4); }
  .small-group .cap { font-size: 10px; color: var(--ink500); margin-top: 6px; }
</style>
</head>
<body>
<div class="page">
  <h1>Concept E1 — veins clipped</h1>
  <div class="sub">Side-by-side: previous (overflowing veins) vs. updated (veins clipped to each leaf silhouette).</div>

  <div class="row">

    <!-- ============ E1 — BEFORE (overflowing) ============ -->
    <div class="cell">
      <div class="tile-wrap">
        <svg class="tile" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bgOld" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#F4EFE3"/>
              <stop offset="1" stop-color="#E8DFC4"/>
            </linearGradient>
          </defs>
          <rect width="1024" height="1024" fill="url(#bgOld)"/>
          <g transform="translate(340 760)">
            <g transform="rotate(0) scale(0.95)">
              <path d="M 0,0 C -100,-20 -180,-140 -170,-260 C -150,-420 -70,-520 0,-560 C 70,-520 150,-420 170,-260 C 180,-140 100,-20 0,0 Z" fill="#6F9275"/>
              <g stroke="#284938" stroke-linecap="round" fill="none" opacity="0.55">
                <path d="M 0,-20 L 0,-540" stroke-width="12"/>
                <path d="M 0,-160 C  40,-180  90,-220  130,-280" stroke-width="9"/>
                <path d="M 0,-160 C -40,-180 -90,-220 -130,-280" stroke-width="9"/>
                <path d="M 0,-280 C  50,-310  110,-360  140,-410" stroke-width="9"/>
                <path d="M 0,-280 C -50,-310 -110,-360 -140,-410" stroke-width="9"/>
                <path d="M 0,-400 C  40,-430  80,-470  100,-500" stroke-width="9"/>
                <path d="M 0,-400 C -40,-430 -80,-470 -100,-500" stroke-width="9"/>
              </g>
            </g>
            <g transform="rotate(90) scale(0.92)">
              <path d="M 0,0 C -100,-20 -180,-140 -170,-260 C -150,-420 -70,-520 0,-560 C 70,-520 150,-420 170,-260 C 180,-140 100,-20 0,0 Z" fill="#1E382A"/>
              <g stroke="#6F9275" stroke-linecap="round" fill="none" opacity="0.7">
                <path d="M 0,-20 L 0,-540" stroke-width="12"/>
                <path d="M 0,-160 C  40,-180  90,-220  130,-280" stroke-width="9"/>
                <path d="M 0,-160 C -40,-180 -90,-220 -130,-280" stroke-width="9"/>
                <path d="M 0,-280 C  50,-310  110,-360  140,-410" stroke-width="9"/>
                <path d="M 0,-280 C -50,-310 -110,-360 -140,-410" stroke-width="9"/>
                <path d="M 0,-400 C  40,-430  80,-470  100,-500" stroke-width="9"/>
                <path d="M 0,-400 C -40,-430 -80,-470 -100,-500" stroke-width="9"/>
              </g>
            </g>
            <g transform="rotate(45) scale(1.0)">
              <path d="M 0,0 C -100,-20 -180,-140 -170,-260 C -150,-420 -70,-520 0,-560 C 70,-520 150,-420 170,-260 C 180,-140 100,-20 0,0 Z" fill="#3F6E54"/>
              <g stroke="#A4C3A0" stroke-linecap="round" fill="none" opacity="0.8">
                <path d="M 0,-20 L 0,-540" stroke-width="13"/>
                <path d="M 0,-160 C  40,-180  90,-220  130,-280" stroke-width="10"/>
                <path d="M 0,-160 C -40,-180 -90,-220 -130,-280" stroke-width="10"/>
                <path d="M 0,-280 C  50,-310  110,-360  140,-410" stroke-width="10"/>
                <path d="M 0,-280 C -50,-310 -110,-360 -140,-410" stroke-width="10"/>
                <path d="M 0,-400 C  40,-430  80,-470  100,-500" stroke-width="10"/>
                <path d="M 0,-400 C -40,-430 -80,-470 -100,-500" stroke-width="10"/>
              </g>
            </g>
            <path d="M 0,0 Q 30,40 70,90" stroke="#3F6E54" stroke-width="18" fill="none" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
      <div class="label-row">Before</div>
      <div class="name">E1 with overflowing veins</div>
    </div>

    <!-- ============ E1 — AFTER (clipped) ============ -->
    <div class="cell">
      <div class="tile-wrap">
        <svg class="tile" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bgNew" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#F4EFE3"/>
              <stop offset="1" stop-color="#E8DFC4"/>
            </linearGradient>

            <!-- Three clip paths, one per leaf, defined in the leaf's local coords. -->
            <clipPath id="leafClipA" clipPathUnits="userSpaceOnUse">
              <path d="M 0,0 C -100,-20 -180,-140 -170,-260 C -150,-420 -70,-520 0,-560 C 70,-520 150,-420 170,-260 C 180,-140 100,-20 0,0 Z"/>
            </clipPath>
            <clipPath id="leafClipB" clipPathUnits="userSpaceOnUse">
              <path d="M 0,0 C -100,-20 -180,-140 -170,-260 C -150,-420 -70,-520 0,-560 C 70,-520 150,-420 170,-260 C 180,-140 100,-20 0,0 Z"/>
            </clipPath>
            <clipPath id="leafClipC" clipPathUnits="userSpaceOnUse">
              <path d="M 0,0 C -100,-20 -180,-140 -170,-260 C -150,-420 -70,-520 0,-560 C 70,-520 150,-420 170,-260 C 180,-140 100,-20 0,0 Z"/>
            </clipPath>
          </defs>

          <rect width="1024" height="1024" fill="url(#bgNew)"/>

          <g transform="translate(340 760)">

            <!-- Leaf A: 12 o'clock, back, moss400 -->
            <g transform="rotate(0) scale(0.95)">
              <path d="M 0,0 C -100,-20 -180,-140 -170,-260 C -150,-420 -70,-520 0,-560 C 70,-520 150,-420 170,-260 C 180,-140 100,-20 0,0 Z" fill="#6F9275"/>
              <g clip-path="url(#leafClipA)" stroke="#284938" stroke-linecap="round" fill="none" opacity="0.55">
                <path d="M 0,-20 L 0,-540" stroke-width="12"/>
                <path d="M 0,-160 C  40,-180  90,-220  130,-280" stroke-width="9"/>
                <path d="M 0,-160 C -40,-180 -90,-220 -130,-280" stroke-width="9"/>
                <path d="M 0,-280 C  50,-310  110,-360  140,-410" stroke-width="9"/>
                <path d="M 0,-280 C -50,-310 -110,-360 -140,-410" stroke-width="9"/>
                <path d="M 0,-400 C  40,-430  80,-470  100,-500" stroke-width="9"/>
                <path d="M 0,-400 C -40,-430 -80,-470 -100,-500" stroke-width="9"/>
              </g>
            </g>

            <!-- Leaf B: 3 o'clock, middle, forest800 -->
            <g transform="rotate(90) scale(0.92)">
              <path d="M 0,0 C -100,-20 -180,-140 -170,-260 C -150,-420 -70,-520 0,-560 C 70,-520 150,-420 170,-260 C 180,-140 100,-20 0,0 Z" fill="#1E382A"/>
              <g clip-path="url(#leafClipB)" stroke="#6F9275" stroke-linecap="round" fill="none" opacity="0.7">
                <path d="M 0,-20 L 0,-540" stroke-width="12"/>
                <path d="M 0,-160 C  40,-180  90,-220  130,-280" stroke-width="9"/>
                <path d="M 0,-160 C -40,-180 -90,-220 -130,-280" stroke-width="9"/>
                <path d="M 0,-280 C  50,-310  110,-360  140,-410" stroke-width="9"/>
                <path d="M 0,-280 C -50,-310 -110,-360 -140,-410" stroke-width="9"/>
                <path d="M 0,-400 C  40,-430  80,-470  100,-500" stroke-width="9"/>
                <path d="M 0,-400 C -40,-430 -80,-470 -100,-500" stroke-width="9"/>
              </g>
            </g>

            <!-- Leaf C: 1:30, front, forest500 (hero) -->
            <g transform="rotate(45) scale(1.0)">
              <path d="M 0,0 C -100,-20 -180,-140 -170,-260 C -150,-420 -70,-520 0,-560 C 70,-520 150,-420 170,-260 C 180,-140 100,-20 0,0 Z" fill="#3F6E54"/>
              <g clip-path="url(#leafClipC)" stroke="#A4C3A0" stroke-linecap="round" fill="none" opacity="0.8">
                <path d="M 0,-20 L 0,-540" stroke-width="13"/>
                <path d="M 0,-160 C  40,-180  90,-220  130,-280" stroke-width="10"/>
                <path d="M 0,-160 C -40,-180 -90,-220 -130,-280" stroke-width="10"/>
                <path d="M 0,-280 C  50,-310  110,-360  140,-410" stroke-width="10"/>
                <path d="M 0,-280 C -50,-310 -110,-360 -140,-410" stroke-width="10"/>
                <path d="M 0,-400 C  40,-430  80,-470  100,-500" stroke-width="10"/>
                <path d="M 0,-400 C -40,-430 -80,-470 -100,-500" stroke-width="10"/>
              </g>
            </g>

            <path d="M 0,0 Q 30,40 70,90" stroke="#3F6E54" stroke-width="18" fill="none" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
      <div class="label-row">After</div>
      <div class="name">E1 with clipped veins</div>
    </div>
  </div>

  <!-- 60pt previews -->
  <div class="small-row">
    <div class="small-group">
      <div class="tile-wrap">
        <svg class="tile" viewBox="0 0 1024 1024">
          <defs>
            <clipPath id="cA" clipPathUnits="userSpaceOnUse"><path d="M 0,0 C -100,-20 -180,-140 -170,-260 C -150,-420 -70,-520 0,-560 C 70,-520 150,-420 170,-260 C 180,-140 100,-20 0,0 Z"/></clipPath>
            <clipPath id="cB" clipPathUnits="userSpaceOnUse"><path d="M 0,0 C -100,-20 -180,-140 -170,-260 C -150,-420 -70,-520 0,-560 C 70,-520 150,-420 170,-260 C 180,-140 100,-20 0,0 Z"/></clipPath>
            <clipPath id="cC" clipPathUnits="userSpaceOnUse"><path d="M 0,0 C -100,-20 -180,-140 -170,-260 C -150,-420 -70,-520 0,-560 C 70,-520 150,-420 170,-260 C 180,-140 100,-20 0,0 Z"/></clipPath>
          </defs>
          <rect width="1024" height="1024" fill="#F4EFE3"/>
          <g transform="translate(340 760)">
            <g transform="rotate(0) scale(0.95)">
              <path d="M 0,0 C -100,-20 -180,-140 -170,-260 C -150,-420 -70,-520 0,-560 C 70,-520 150,-420 170,-260 C 180,-140 100,-20 0,0 Z" fill="#6F9275"/>
              <g clip-path="url(#cA)" stroke="#284938" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.55"><path d="M 0,-20 L 0,-540"/></g>
            </g>
            <g transform="rotate(90) scale(0.92)">
              <path d="M 0,0 C -100,-20 -180,-140 -170,-260 C -150,-420 -70,-520 0,-560 C 70,-520 150,-420 170,-260 C 180,-140 100,-20 0,0 Z" fill="#1E382A"/>
              <g clip-path="url(#cB)" stroke="#6F9275" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.7"><path d="M 0,-20 L 0,-540"/></g>
            </g>
            <g transform="rotate(45) scale(1.0)">
              <path d="M 0,0 C -100,-20 -180,-140 -170,-260 C -150,-420 -70,-520 0,-560 C 70,-520 150,-420 170,-260 C 180,-140 100,-20 0,0 Z" fill="#3F6E54"/>
              <g clip-path="url(#cC)" stroke="#A4C3A0" stroke-width="13" stroke-linecap="round" fill="none" opacity="0.8"><path d="M 0,-20 L 0,-540"/></g>
            </g>
          </g>
        </svg>
      </div>
      <div class="cap">60pt preview</div>
    </div>
  </div>
</div>
</body>
</html>
