name: Quality metrics

# Informational-only. Posts (or updates) a single PR comment with cyclomatic
# complexity worst-5 and coverage summary. Never fails the build — these
# numbers are surfaced for trend visibility, not as a merge gate.
# See AGENTS.md step 4 "Informational metadata (not a gate)".

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  complexity:
    name: Complexity (worst-5 CCN)
    runs-on: ubuntu-latest
    # Never block merge on this job.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install lizard
        run: pip install --quiet 'lizard>=1.17'

      - name: Determine changed paths
        id: changed
        run: |
          # Files touched in this PR, relative to the merge base.
          BASE_SHA=$(git merge-base origin/${{ github.base_ref }} HEAD)
          git diff --name-only "$BASE_SHA" HEAD > changed-files.txt
          echo "Changed files:" >&2
          cat changed-files.txt >&2

      - name: Run lizard and build report
        id: report
        run: |
          set -euo pipefail
          # Scan production source only — tests and build dirs are excluded.
          # If a directory does not exist (e.g. solo-language PR), lizard
          # silently skips it.
          # --csv is the actual flag (lowercase). Errors are surfaced as a
          # failed step rather than swallowed — the job is already
          # continue-on-error so a parse failure won't gate the PR but it
          # will be visible in the run summary.
          lizard \
            --csv \
            server/grove \
            ios/Grove/Grove \
            ios/Grove/OracleCore/Sources \
            > lizard.csv

          python3 - <<'PY' > comment-body.md
          import csv
          import os

          changed = set()
          try:
              with open("changed-files.txt") as f:
                  changed = {line.strip() for line in f if line.strip()}
          except FileNotFoundError:
              pass

          rows = []
          try:
              with open("lizard.csv") as f:
                  for r in csv.reader(f):
                      # lizard --csv columns (verified against lizard 1.17):
                      #   0: nloc
                      #   1: ccn
                      #   2: tokens
                      #   3: param
                      #   4: length
                      #   5: full_id  ("name@start-end@path")
                      #   6: file_path
                      #   7: short_name
                      #   8: long_signature
                      #   9: start_line
                      #  10: end_line
                      if len(r) < 10:
                          continue
                      try:
                          ccn = int(r[1])
                      except ValueError:
                          continue
                      file_path = r[6]
                      name = r[7]
                      location = f"{file_path}:{r[9]}"
                      rows.append((ccn, name, file_path, location))
          except FileNotFoundError:
              pass

          rows.sort(key=lambda x: x[0], reverse=True)
          top = rows[:5]

          lines = ["<!-- quality-metrics-bot -->"]
          lines.append("### Quality metrics (informational — not a merge gate)")
          lines.append("")
          if not top:
              lines.append("_No complexity data — lizard returned no rows._")
          else:
              lines.append("**Complexity — top 5 functions by CCN** "
                           "(★ = file touched in this PR):")
              lines.append("")
              lines.append("| ★ | Function | CCN | Location |")
              lines.append("|---|---|---|---|")
              for ccn, name, file_path, location in top:
                  star = "★" if file_path in changed else ""
                  # Escape pipe characters in names so the table renders.
                  safe_name = name.replace("|", "\\|")
                  lines.append(f"| {star} | `{safe_name}` | {ccn} | "
                               f"`{location}` |")
          lines.append("")
          lines.append(
              "_Coverage Δ reporting is a follow-up — see issue "
              "tracker. Raw coverage artifacts (`coverage-server`, "
              "`coverage-ios-core`) are uploaded by the other jobs._"
          )

          print("\n".join(lines))
          PY

      - name: Post or update PR comment
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment-body.md', 'utf8');
            const marker = '<!-- quality-metrics-bot -->';

            // Paginate the comment list so the marker search works on PRs
            // with more than 100 comments. Without pagination the bot would
            // miss its existing comment and stack a duplicate on every push.
            // See issue #134.
            let existing;
            for (let page = 1; ; page++) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
                page,
              });
              existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) break;
              if (comments.length < 100) break;
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
