name: CI

on:
  push:
    branches: [develop]
    paths:
      - "server/**"
      - ".github/workflows/**"
      - "AGENTS.md"
      - ".claude/**"
      - "Makefile"
      - "docker-compose.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/**"
      - "AGENTS.md"
      - ".claude/**"
      - "Makefile"
      - "docker-compose.yml"
      - "docker-compose.dev.yml"

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - "server/**"
              - "Makefile"
              - "docker-compose.yml"
              - "docker-compose.dev.yml"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Skipped — no relevant changes
        if: needs.changes.outputs.server != 'true'
        run: echo "Skipped — no relevant changes"

      - uses: actions/checkout@v6
        if: needs.changes.outputs.server == 'true'

      - uses: actions/setup-python@v6
        if: needs.changes.outputs.server == 'true'
        with:
          python-version: "3.12"

      - name: Cache pip
        if: needs.changes.outputs.server == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('server/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dev dependencies
        if: needs.changes.outputs.server == 'true'
        run: pip install -e "server/[dev]"

      - name: ruff check
        if: needs.changes.outputs.server == 'true'
        run: ruff check server/

      - name: ruff format --check
        if: needs.changes.outputs.server == 'true'
        run: ruff format --check server/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: changes

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: oracle_test
          POSTGRES_USER: oracle
          POSTGRES_PASSWORD: oracle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oracle -d oracle_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://oracle:oracle@localhost:5432/oracle_test
      BEARER_TOKEN: ci-dummy-token
      OPENAI_API_KEY: ci-stub-key

    steps:
      - name: Skipped — no relevant changes
        if: needs.changes.outputs.server != 'true'
        run: echo "Skipped — no relevant changes"

      - uses: actions/checkout@v6
        if: needs.changes.outputs.server == 'true'

      - uses: actions/setup-python@v6
        if: needs.changes.outputs.server == 'true'
        with:
          python-version: "3.12"

      - name: Cache pip
        if: needs.changes.outputs.server == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('server/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        if: needs.changes.outputs.server == 'true'
        run: pip install -e "server/[dev]"

      - name: Apply migrations
        if: needs.changes.outputs.server == 'true'
        working-directory: server
        run: alembic upgrade head

      - name: Run tests
        if: needs.changes.outputs.server == 'true'
        run: pytest server/tests/

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    needs: changes

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: oracle_test
          POSTGRES_USER: oracle
          POSTGRES_PASSWORD: oracle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oracle -d oracle_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://oracle:oracle@localhost:5432/oracle_test
      BEARER_TOKEN: ci-dummy-token

    steps:
      - name: Skipped — no relevant changes
        if: needs.changes.outputs.server != 'true'
        run: echo "Skipped — no relevant changes"

      - uses: actions/checkout@v6
        if: needs.changes.outputs.server == 'true'

      - uses: actions/setup-python@v6
        if: needs.changes.outputs.server == 'true'
        with:
          python-version: "3.12"

      - name: Cache pip
        if: needs.changes.outputs.server == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('server/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        if: needs.changes.outputs.server == 'true'
        run: pip install -e "server/[dev]"

      - name: Upgrade to head
        if: needs.changes.outputs.server == 'true'
        working-directory: server
        run: alembic upgrade head

      - name: Downgrade to base
        if: needs.changes.outputs.server == 'true'
        working-directory: server
        run: alembic downgrade base

      - name: Upgrade to head again
        if: needs.changes.outputs.server == 'true'
        working-directory: server
        run: alembic upgrade head
