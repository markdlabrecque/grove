name: iOS CI

# Runs only when iOS source files (or this workflow file) change, so
# server-only PRs do not burn macOS runner minutes.

# ---------------------------------------------------------------------------
# CI job strategy — why there is only one job here
#
# The app's deployment target is iOS 26, which requires the iOS 26 SDK (Xcode
# 26+). As of this writing, macos-latest ships Xcode 16.2 and cannot build
# the Oracle app target or run the full Oracle scheme tests.
#
# Additionally, the xcconfig files that inject BASE_URL and BEARER_TOKEN into
# the build are gitignored by design (they hold per-developer credentials).
# Any xcodebuild run against the Oracle scheme on CI would fail at config
# injection even if the SDK were available.
#
# For these reasons the canary job (xcodebuild test on the Oracle scheme) has
# been removed from CI. The equivalent coverage runs locally via:
#
#   make ios-test
#
# which executes both ios-test-core and ios-test-app on the developer's own
# Xcode 26 environment with a populated xcconfig. This is the required
# pre-push check per the AGENTS.md workflow.
#
# TODO(ci): Once macos-latest ships Xcode 26, re-add the full-app job here as
# a required check and retire the two-job split note in ios/README.md. At that
# point the xcconfig problem will also need a CI-safe solution (e.g. a
# separate xcconfig with placeholder values committed for CI use only).
# ---------------------------------------------------------------------------

"on":
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"

# Cancel any in-flight run for the same branch/ref when a new commit is pushed.
# Prevents hung tests from consuming the full 6-hour runner budget across pushes.
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # stable: required check for develop branch protection.
  #
  # Runs `swift test` against the OracleCore Swift Package only. No xcodebuild,
  # no simulator, no iOS 26 SDK surface area. Passes on any runner that has
  # Xcode 16+ (PackageDescription 6.0) installed.
  #
  # This is the gate that blocks merges. It covers all logic-level code:
  # Config, OracleAPI request builder, Codable models, JSON fixtures.
  # ---------------------------------------------------------------------------
  stable:
    name: Core (stable gate)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Pin the Xcode version so a toolchain upgrade on the runner image does
        # not silently break the build between PRs.
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Show Xcode / Swift version
        run: |
          xcodebuild -version
          swift --version

      - name: swift test (OracleCore)
        run: swift test --package-path ios/Oracle/OracleCore --enable-code-coverage

      - name: Extract OracleCore coverage
        run: |
          set -euo pipefail
          PROF=$(find ios/Oracle/OracleCore/.build -name '*.profdata' | head -n1)
          BIN=$(find ios/Oracle/OracleCore/.build -name 'OracleCorePackageTests.xctest' | head -n1)
          if [ -z "$PROF" ] || [ -z "$BIN" ]; then
            echo "Coverage artifacts not found — skipping export." >&2
            exit 0
          fi
          # Resolve the actual test binary inside the bundle (macOS layout).
          BIN_EXEC="$BIN/Contents/MacOS/OracleCorePackageTests"
          if [ ! -f "$BIN_EXEC" ]; then
            BIN_EXEC="$BIN"
          fi
          xcrun llvm-cov export \
            -format=lcov \
            -instr-profile "$PROF" \
            "$BIN_EXEC" \
            > coverage-ios-core.lcov
          # Summary line for the CI log.
          xcrun llvm-cov report \
            -instr-profile "$PROF" \
            "$BIN_EXEC" \
            -ignore-filename-regex='\.build/|Tests/' | tail -n5

      - name: Upload OracleCore coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ios-core
          path: coverage-ios-core.lcov
          if-no-files-found: ignore
          retention-days: 14
