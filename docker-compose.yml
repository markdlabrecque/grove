services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: grove
      POSTGRES_USER: grove
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grove -d grove"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BEARER_TOKEN: ${BEARER_TOKEN}
      DATABASE_URL: postgresql+asyncpg://grove:${POSTGRES_PASSWORD}@postgres:5432/grove
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8000"

  apache:
    image: httpd:2.4
    restart: unless-stopped
    depends_on:
      - app
    environment:
      TAILSCALE_HOSTNAME: ${TAILSCALE_HOSTNAME}
    ports:
      - "${GROVE_HTTPS_PORT:-8443}:443"
    volumes:
      - ./ops/apache/httpd.conf.template:/etc/apache-templates/httpd.conf.template:ro
      - ./ops/apache/grove.conf.template:/etc/apache-templates/grove.conf.template:ro
      - ./ops/apache/entrypoint.sh:/usr/local/bin/grove-entrypoint.sh:ro
      - ./ops/certs:/usr/local/apache2/conf/certs:ro
    entrypoint: ["/usr/local/bin/grove-entrypoint.sh"]
    command: ["httpd-foreground"]

volumes:
  postgres-data:
